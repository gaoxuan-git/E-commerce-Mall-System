<!DOCTYPE html>
<html lang=zh-CN>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
        <title>加载中...</title>
        <meta name="Copyright" content="helang">
       <!-- <link rel="shortcut icon" type="image/png" href="/uniapp-extend/static/logo.png"> -->
        <meta name="keywords" content="加载中...">
        <meta name="description" content="加载中...">
        <style type="text/css">
            body{
                margin: 0;
                background-color:  #f5f5f5;
            }
            iframe{
                width: 375px;
                height: 667px;
                background-color: #fff;
                /* box-sizing: content-box; */
				box-sizing: border-box;
                border: none;
            }
			
            @media screen and (min-width: 450px) {
                iframe {
                    position: fixed;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    left: 0;
                    margin: auto;
					border: 1px solid #f5f5f5;
                    border-radius: 4px;
                }
            }
        </style>
        <script type="text/javascript">
            window.isPC = true;
            var targetUrl = new URL(window.location.href);
            var targetPath = targetUrl.searchParams.get('__h5_path') || '/';
            if (targetPath.charAt(0) !== '/' || targetPath.indexOf('//') === 0 ||
                targetPath.indexOf('\\') !== -1 || targetPath.indexOf('?') !== -1 ||
                targetPath.indexOf('#') !== -1 || targetPath === '/static/html/pc.html') {
                targetPath = '/';
            }
            targetUrl.pathname = targetPath;
            targetUrl.searchParams.delete('__h5_path');
            window.onload = function(){
                /* 监听电脑浏览器窗口尺寸改变 */
				if(window.innerWidth <= 430){
					window.location.replace(targetUrl.href);
				}
            }
        </script>
    </head>
    <body>
       <!--若你的项目未设置根目录（默认为 / 时），则使用下方代码-->
		<iframe id="iframe"></iframe>
		<script type="text/javascript">
		    document.getElementById('iframe').src = targetUrl.href;
		</script>
		<script src="https://pv.sohu.com/cityjson?ie=utf-8"></script>
		<script type="text/javascript">
		      // var Ip=returnCitySN['cip']
		      // localStorage.setItem('Ip', Ip)
		</script>
    </body>
</html>
